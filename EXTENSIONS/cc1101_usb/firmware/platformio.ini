; RaspyJack CC1101-over-USB bridge — ESP32-S3 / ESP32-C3
;
; Flash S3 (default):  pio run -t upload
; Flash C3:            pio run -e esp32-c3 -t upload
; Monitor:             pio device monitor   (115200)
;
; The firmware uses only the stable Arduino core (SPI, digitalWrite,
; delayMicroseconds, attachInterrupt, micros) — no RMT — so it builds
; identically on arduino-esp32 2.x and 3.x, and on both S3 and C3.
; Pin maps are per-env build_flags; the .cpp is pin-agnostic.

; The carrier PCB (pcb/) is wired for the ESP32-C3 SuperMini, so C3 is the
; default build. The S3 env stays for a bare-wire/breadboard S3 build.
[platformio]
default_envs = esp32-c3

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    ; Route Serial to the native USB Serial/JTAG CDC (HWCDC) on both S3 and C3.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ---------- ESP32-S3 ----------
; Any GPIO works; defaults avoid strapping (0/45/46) and USB (19/20).
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D PIN_SCK=12
    -D PIN_MISO=13
    -D PIN_MOSI=11
    -D PIN_CS=10
    -D PIN_GDO0=4
    -D PIN_GDO2=5
    -D PIN_RF_SW=-1

; ---------- ESP32-C3 ----------
; C3 has fewer GPIOs: 12–17 are the SPI flash (forbidden), 18/19 are USB D-/D+,
; and 2/8/9 are strapping pins — so this map stays on 3..7 and 10.
; Board: esp32-c3-devkitm-1 fits most C3 "SuperMini" clones too.
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D PIN_SCK=4
    -D PIN_MISO=5
    -D PIN_MOSI=6
    -D PIN_CS=7
    -D PIN_GDO0=10
    -D PIN_GDO2=3
    -D PIN_RF_SW=-1
