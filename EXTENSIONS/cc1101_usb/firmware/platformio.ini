; RaspyJack CC1101-over-USB bridge — ESP32-S3
;
; Flash:   pio run -t upload
; Monitor: pio device monitor   (115200)
;
; The firmware uses only the stable Arduino core (SPI, digitalWrite,
; delayMicroseconds, attachInterrupt, micros) — no RMT — so it builds
; identically on arduino-esp32 2.x and 3.x.

[env:esp32-s3-devkitc-1]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    ; Route Serial to the native USB-CDC port (what the host opens).
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; --- Pin map (override here if your wiring differs) ---
; Passed to the firmware as compile-time defaults.
    -D PIN_SCK=12
    -D PIN_MISO=13
    -D PIN_MOSI=11
    -D PIN_CS=10
    -D PIN_GDO0=4
    -D PIN_GDO2=5
    -D PIN_RF_SW=-1
